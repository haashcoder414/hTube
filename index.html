<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hTube - Enter Password</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050a14;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .login-box {
            background: #0b162c;
            border: 2px solid #00a8ff;
            box-shadow: 0 0 20px rgba(0, 168, 255, 0.4);
            border-radius: 12px;
            padding: 30px;
            max-width: 380px;
            width: 90%;
        }
        .login-box img {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        h2 {
            margin-top: 0;
            color: #00a8ff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0 15px 0;
            box-sizing: border-box;
            border: 1px solid #00a8ff;
            border-radius: 6px;
            background: #050a14;
            color: #ffffff;
            font-size: 16px;
            text-align: center;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #00a8ff;
            color: #050a14;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #33b8ff;
        }
        #error-msg {
            color: #ff4d4d;
            margin-top: 12px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <!-- Change "logo.png" to match your image file name -->
        <img src="hTube logo.png" alt="hTube Logo">
        <h2>Private Access</h2>
        <p>Enter the password to watch my Minecraft videos.</p>
        
        <form onsubmit="checkPassword(event)">
            <input type="password" id="passwordInput" placeholder="Enter password..." required>
            <button type="submit">Unlock hTube</button>
        </form>
        
        <p id="error-msg">Wrong password! Try again.</p>
    </div>

    <script>
        function checkPassword(event) {
            event.preventDefault();
            
            // CHANGE YOUR PASSWORD HERE:
            const channelOne = "523623"; 
            const channelTwo = "ilurvgoogoogaga"
            
            const entered = document.getElementById("passwordInput").value;
            
            if (entered === channelOne) {
                // Saves a temporary pass so index.html knows they logged in
                sessionStorage.setItem("htube_unlocked", "true");
                window.location.href = "Channel 1.html";
             if (entered === channelTwo) {
                // Saves a temporary pass so index.html knows they logged in
                sessionStorage.setItem("htube_unlocked", "true");
                window.location.href = "Channel 2.html";
            } else {
                document.getElementById("error-msg").style.display = "block";
            }
        }
    </script>

</body>
</html>
